# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-added-large-files
      name: general-check-added-large-files
    - id: check-json
      name: general-check-json
    - id: check-xml
      name: general-check-xml
    - id: check-yaml
      name: general-check-yaml
      exclude: '^(helm/.+/templates/|.+/conffiles/)'
    - id: check-toml
      name: backend-check-toml
    - id: trailing-whitespace
      name: general-trailing-whitespace
    - id: pretty-format-json
      name: general-pretty-format-json
      args: [--autofix]
- repo: "https://git.knut.univention.de/univention/infrastructure/pre-commit-hooks/addlicense"
  rev: "v1.0.3"
  hooks:
    - id: "addlicense"
      name: "Check or add license headers to files"
- repo: https://github.com/psf/black
  rev: 24.10.0
  hooks:
    - id: black
      name: backend-black
      exclude: "udm_client.py"
- repo: https://github.com/PyCQA/bandit
  rev: 1.7.10
  hooks:
    - id: bandit
      name: backend-bandit
      exclude: "authorization-api/tests/|management-api/tests|udm_client.py|guardian-lib/guardian_pytest|guardian-lib/tests|authorization-client/tests|univention-guardian/tests"
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.13.0
  hooks:
    - id: mypy
- repo: https://github.com/jackdewinter/pymarkdown
  rev: v0.9.25
  hooks:
    - id: pymarkdown
      name: general-markdown
      exclude: ".gitlab/issue_templates/|helm/|docs/project-context.md"
      args:
        - --disable-rules
        - MD013,MD024,MD034,MD041
        - scan
        # Rules pymarkdown: https://github.com/jackdewinter/pymarkdown/blob/main/docs/rules.md
        # Rules markdownlint: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
        # MD013: Allow arbitrary line length
        # MD024: Allow duplicate headings
        # MD034: Allow bare URLs
        # MD041: First line in file should be a top level heading

- repo: https://github.com/charliermarsh/ruff-pre-commit
  rev: 'v0.8.0'
  hooks:
    - id: ruff
      name: backend-ruff
      args: [--fix]
      exclude: "udm_client.py"

exclude: ".claude|.opencode|_bmad*"
