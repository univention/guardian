# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      name: general-check-added-large-files
    - id: check-json
      name: general-check-json
    - id: check-xml
      name: general-check-xml
    - id: check-yaml
      name: general-check-yaml
      exclude: '^(helm/.+/templates/|.+/conffiles/)'
    - id: check-toml
      name: backend-check-toml
    - id: trailing-whitespace
      name: general-trailing-whitespace
    - id: pretty-format-json
      name: general-pretty-format-json
      args: [--autofix]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.0
  hooks:
    - id: mypy
- repo: "https://github.com/norwoodj/helm-docs"
  rev: "v1.12.0"
  hooks:
    - id: helm-docs
      name: helm-docs
      description: >-
        Regenerates the README.md of every chart under helm/ from its
        values.yaml and README.md.gotmpl.
      language: script
      require_serial: true
      args:
        - --chart-search-root=helm
- repo: "https://git.knut.univention.de/univention/dev/tooling/kyverno-test-pre-commit"
  rev: "v0.5.0"
  hooks:
    - id: "kyverno-test"
- repo: https://github.com/jackdewinter/pymarkdown
  rev: v0.9.39
  hooks:
    - id: pymarkdown
      name: general-markdown
      exclude: ".gitlab/issue_templates/|helm/|docs/project-context.md"
      args:
        - --disable-rules
        - MD013,MD024,MD034,MD041
        - scan
        # Rules pymarkdown: https://github.com/jackdewinter/pymarkdown/blob/main/docs/rules.md
        # Rules markdownlint: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
        # MD013: Allow arbitrary line length
        # MD024: Allow duplicate headings
        # MD034: Allow bare URLs
        # MD041: First line in file should be a top level heading

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.22
  hooks:
    - id: ruff-check
      alias: "ruff"
    - id: ruff-check
      alias: "ruff-fix"
      stages: [ manual ]
      args: ["--fix", "--unsafe-fixes"]
    - id: ruff-check
      alias: "ruff-statistics"
      stages: [ manual ]
      args: ["--statistics"]
    - id: ruff-format
      alias: "ruff-format"
    - id: ruff-format
      alias: "ruff-format-check"
      stages: [ manual ]
      args: ["--check"]

exclude: ".claude|.opencode"
