[tool.ruff]
target-version = "py311"
output-format = "concise"

line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "N", "PT"]
ignore = [
 "S101",  # allow to use assert (must be used in pytest)
 "S404",  # suspicious-subprocess-import
 "S603",  # subprocess-without-shell-equals-true
 "Q000",  # allow single quotes
 "Q001",  # allow single quote multiline strings
 "Q003",  # <https://docs.astral.sh/ruff/rules/avoidable-escaped-quote/>
]

unfixable = ["RUF100", "T20"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

allowed-confusables = ["’", "`", "´"]

task-tags = ["TODO", "FIXME"]

[tool.ruff.lint.extend-per-file-ignores]
"**/tests/*" = [
 "E266",  # ucs-test header
 "S101",  # allow to use assert (must be used in pytest)
 "S105",
 "S106",
 "N999",  # invalid-module-name
 "PLC0415",
 "CPY001",
]

[tool.ruff.format]
quote-style = "single"  # https://github.com/astral-sh/ruff/issues/7525

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
multiline-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true

[tool.ruff.lint.ruff]
parenthesize-tuple-in-subscript = true

[tool.ruff.lint.flake8-copyright]
# notice-rgx = "(?i)Copyright\\s+((?:\\(C\\)|©)\\s+)?\\d{4}((-|,\\s)\\d{4})*"
notice-rgx = "(?:Copyright(?:\\s+\\(C\\)|:)?|SPDX-FileCopyrightText:)\\s+([0-9, -]+)\\s+(?:by|Univention\\s+GmbH)"
min-file-size = 2

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["univention"]
lines-after-imports = 2
