---
# -- Global values, shared with the umbrella chart and its other subcharts.
global:
  # -- Allows to configure extensions globally.
  extensions: []
  # -- Allows to configure system extensions globally.
  systemExtensions: []

  # -- Container registry address.
  imageRegistry: "artifacts.software-univention.de"

  # -- Credentials to fetch images from private registry.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  #
  # imagePullSecrets:
  #   - "docker-registry"
  imagePullSecrets: []

  # -- Define an ImagePullPolicy.
  #
  # Ref.: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
  #
  # "IfNotPresent" => The image is pulled only if it is not already present locally.
  # "Always" => Every time the kubelet launches a container, the kubelet queries the container image registry to
  #             resolve the name to an image digest. If the kubelet has a container image with that exact digest cached
  #             locally, the kubelet uses its cached image; otherwise, the kubelet pulls the image with the resolved
  #             digest, and uses that image to launch the container.
  # "Never" => The kubelet does not try fetching the image. If the image is somehow already present locally, the
  #            kubelet attempts to start the container; otherwise, startup fails.
  imagePullPolicy: null

# -- Additional custom annotations to add to all deployed objects.
additionalAnnotations: {}

# -- Additional custom labels to add to all deployed objects.
additionalLabels: {}

# -- Affinity for pod assignment.
# Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

# -- Security Context.
# Cerbos ships as a "scratch" image and runs as the fixed guardian-server uid/gid 64110.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
containerSecurityContext:
  # -- Run the container in privileged mode.
  privileged: false
  # -- Enable container privileged escalation.
  allowPrivilegeEscalation: false
  # -- Security capabilities for container.
  capabilities:
    # -- List of capabilities to be dropped.
    drop:
      - "ALL"
  # -- Enable security context.
  enabled: true
  # -- Process user id.
  runAsUser: 64110
  # -- Process group id.
  runAsGroup: 64110
  # -- Run container as a user.
  runAsNonRoot: true
  # -- Mounts the container's root filesystem as read-only.
  readOnlyRootFilesystem: true
  # -- Set Seccomp profile.
  seccompProfile:
    # -- Disallow custom Seccomp profile by setting it to RuntimeDefault.
    type: "RuntimeDefault"

# -- Extensions to load. This will override the configuration in
# `global.extensions`. Cerbos policies are read from the `guardian-policies`
# plugin directory of each image.
#
# extensions:
#   - name: "my-integration"
#     image:
#       registry: "artifacts.example.com"
#       repository: "path/to/repository"
#       pullPolicy: "IfNotPresent"
#       tag: "1.1.10"
extensions: []

# -- Array with extra environment variables to add to containers.
#
# extraEnvVars:
#   - name: FOO
#     value: "bar"
extraEnvVars: []

# -- Optionally specify an extra list of additional volumes. This is how another
# component ships its own policies, as a ConfigMap mounted below `/policies`.
#
# extraVolumes:
#   - name: "portal-policies"
#     configMap:
#       name: "{{ .Release.Name }}-portal-policies"
extraVolumes: []

# -- Optionally specify an extra list of additional volumeMounts. Mounted into
# the Cerbos container and the policy validation init container alike, so
# policies added here are compiled before the server starts.
#
# extraVolumeMounts:
#   - name: "portal-policies"
#     mountPath: "/policies/portal"
#     readOnly: true
extraVolumeMounts: []

# -- Provide a name to substitute for the full names of resources.
fullnameOverride: ""

# -- Credentials to fetch images from private registry.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
#
# imagePullSecrets:
#   - "docker-registry"
imagePullSecrets: []

# -- Lifecycle to automate configuration before or after startup.
lifecycleHooks: {}

# -- Configure extra options for container liveness probes.
livenessProbe:
  # -- Number of failed executions until container is terminated.
  failureThreshold: 10
  # -- Delay after container start until LivenessProbe is executed.
  initialDelaySeconds: 15
  # -- Time between probe executions.
  periodSeconds: 20
  # -- Number of successful executions after failed ones until container is marked healthy.
  successThreshold: 1
  # -- Timeout for command return.
  timeoutSeconds: 5
  # -- The Cerbos health endpoint.
  httpGet:
    # -- Path of the health endpoint.
    path: "/_cerbos/health"
    # -- Port the health endpoint is served on.
    port: "http"

# -- String to partially override release name.
nameOverride: ""

# -- Node labels for pod assignment.
# Ref: https://kubernetes.io/docs/user-guide/node-selection/
nodeSelector: {}

# -- Pod Annotations.
podAnnotations: {}

# -- Pod Security Context.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  # -- Enable security context.
  enabled: true

  # -- If specified, all processes of the container are also part of the supplementary group.
  fsGroup: 64110

  # -- Change ownership and permission of the volume before being exposed inside a Pod.
  fsGroupChangePolicy: "Always"

# -- Configure extra options for container startup probes.
readinessProbe:
  # -- Number of failed executions until container is terminated.
  failureThreshold: 10
  # -- Delay after container start until ReadinessProbe is executed.
  initialDelaySeconds: 15
  # -- Time between probe executions.
  periodSeconds: 20
  # -- Number of successful executions after failed ones until container is marked healthy.
  successThreshold: 1
  # -- Timeout for command return.
  timeoutSeconds: 5
  # -- The Cerbos health endpoint.
  httpGet:
    # -- Path of the health endpoint.
    path: "/_cerbos/health"
    # -- Port the health endpoint is served on.
    port: "http"

# -- Set the amount of replicas of deployment.
replicaCount: 1

# -- Configure resource requests and limits.
#
# Ref: https://kubernetes.io/docs/user-guide/compute-resources/
resources:
  # -- Resources the container is guaranteed and scheduled with.
  requests:
    # -- CPU the container is guaranteed and scheduled with.
    cpu: "100m"
    # -- Memory the container is guaranteed and scheduled with.
    memory: "128Mi"
  # -- Resource ceilings the container is held to.
  limits:
    # -- Memory ceiling, above which the container is OOM-killed. No CPU limit
    # is set, so policy compilation may burst above the request.
    memory: "512Mi"

# -- Kubernetes Service for the Cerbos ports.
service:
  # -- Additional custom annotations.
  annotations: {}
  # -- Enable kubernetes service creation.
  enabled: true
  # -- Choose the kind of Service, one of "ClusterIP", "NodePort" or "LoadBalancer".
  type: "ClusterIP"
  # The ports are fixed at the Cerbos defaults, 3592 (HTTP) and 3593 (gRPC).

# -- Service account the pod runs under.
# Ref.: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- Annotations to add to the service account.
  annotations: {}
  # -- Allows auto mount of ServiceAccountToken on the serviceAccount created.
  # Can be set to false if pods using this serviceAccount do not need to use the
  # Kubernetes API.
  automountServiceAccountToken: false

# -- Configure extra options for container probes.
startupProbe:
  # -- Number of failed executions until container is terminated.
  failureThreshold: 10
  # -- Delay after container start until StartupProbe is executed.
  initialDelaySeconds: 15
  # -- Time between probe executions.
  periodSeconds: 20
  # -- Number of successful executions after failed ones until container is marked healthy.
  successThreshold: 1
  # -- Timeout for command return.
  timeoutSeconds: 5
  # -- The Cerbos health endpoint.
  httpGet:
    # -- Path of the health endpoint.
    path: "/_cerbos/health"
    # -- Port the health endpoint is served on.
    port: "http"

# -- Allows to configure the system extensions to load. This is intended for
# internal usage, prefer to use `extensions` for user configured extensions.
# This value will override the configuration in `global.systemExtensions`.
systemExtensions: []

# -- In seconds, time given to the pod to terminate gracefully.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
terminationGracePeriodSeconds: ""

# -- Tolerations for pod assignment.
# Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# -- Topology spread constraints rely on node labels to identify the topology domain(s) that each Node is in.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
#
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: failure-domain.beta.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
topologySpreadConstraints: []

# -- Configure the update strategy.
#
# Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
#
# Example:
# updateStrategy:
#  type: RollingUpdate
#  rollingUpdate:
#    maxSurge: 25%
#    maxUnavailable: 25%
updateStrategy:
  # -- Deployment update strategy, one of "RollingUpdate" or "Recreate".
  type: "RollingUpdate"

# -- Cerbos policy engine configuration.
cerbos:
  # -- Container image section.
  image:
    # -- Container registry address. Higher precedence than global.imageRegistry.
    registry: ""
    # -- Container image repository.
    repository: "nubus/images/cerbos"
    # -- Image pull policy. Higher precedence than global.imagePullPolicy.
    pullPolicy: null
    # -- Container image tag.
    tag: "0.54.0@sha256:211c261f6031675522a35c6055b13fd719c4aff13747307e4bcb6907326537ef"

  # -- Policy validation before the server starts.
  policyValidation:
    # -- Run `cerbos compile` in an init container before the server starts, so
    # an invalid policy tree stalls the rollout instead of crash-looping Cerbos.
    enabled: true

  # -- Cerbos log level: one of DEBUG, INFO, WARN, ERROR. A command line flag,
  # not part of the server configuration file.
  logLevel: "WARN"

  # -- Cerbos server configuration, written verbatim to `/config/cerbos.yaml`.
  # Anything Cerbos accepts can be set here; Helm merges overrides key by key.
  # `storage` is the exception: the chart owns and hard-codes it.
  #
  # Ref: https://docs.cerbos.dev/cerbos/latest/configuration/index.html
  config:
    # -- Cerbos server block.
    # Ref: https://docs.cerbos.dev/cerbos/latest/configuration/server
    server:
      # -- Serve the policy playground from the server. Off: it evaluates
      # arbitrary policies supplied by the caller.
      playgroundEnabled: false
      # -- Serve the interactive API explorer. Off: it is a documentation UI on
      # an endpoint that answers authorization questions.
      apiExplorerEnabled: false
      # -- Ceilings on a single check request, so one caller cannot ask for an
      # unbounded amount of evaluation.
      requestLimits:
        # -- Maximum actions asked about per resource.
        maxActionsPerResource: 500
        # -- Maximum resources asked about per request.
        maxResourcesPerRequest: 500
    # -- Cerbos schema block.
    # Ref: https://docs.cerbos.dev/cerbos/latest/configuration/schema
    schema:
      # -- What a request that violates an attribute schema does, one of
      # "none", "warn" or "reject".
      enforcement: "reject"
    # -- Cerbos telemetry block.
    telemetry:
      # -- Report anonymous usage statistics upstream.
      disabled: true

  # -- Policies supplied through this chart, one file per key, mounted at
  # `/policies/chart`. Empty by default: Cerbos denies everything until
  # something puts policies in front of it.
  #
  # cerbos:
  #   policies:
  #     resource_myapp.yaml: |
  #       apiVersion: api.cerbos.dev/v1
  #       resourcePolicy:
  #         resource: myapp.thing
  #         version: "default"
  #         rules:
  #           - actions: ["read"]
  #             effect: EFFECT_ALLOW
  #             roles: ["*"]
  policies: {}
...
