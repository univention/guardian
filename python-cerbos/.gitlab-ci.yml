variables:
  UV_VERSION: 0.6.6
  PYTHON_VERSION: 3.11
  BASE_LAYER: bookworm-slim
  UV_IMAGE: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy
  DEBIAN_PACKAGE: python-cerbos
  DEBIAN_RELEASE: ${DEBIAN_RELEASE:-5.2-0-0}
  DEBIAN_SCOPE: ${DEBIAN_SCOPE:-errata5.2-6}

stages:
  - build

build_deb_repo_import:
  stage: build
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: manual
  tags:
    - omar
  script:
    - |
      repo_admin.py \
        --git "$CI_REPOSITORY_URL" \
        --branch "$CI_COMMIT_REF_NAME" \
        --path "." \
        --release "$DEBIAN_RELEASE" \
        --scope "$DEBIAN_SCOPE" \
        --package "$DEBIAN_PACKAGE" \
        --verbose

build_deb_repo_build:
  stage: build
  needs:
    - job: build_deb_repo_import
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: manual
  tags:
    - ladda
  script:
    - |
      build-package-ng \
        --no-pbuilder-update \
        --release "$DEBIAN_RELEASE" \
        --scope "$DEBIAN_SCOPE" \
        --package "$DEBIAN_PACKAGE"
