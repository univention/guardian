apiVersion: api.cerbos.dev/v1

derivedRoles:
  name: udm_derived_roles

  definitions:
    - name: helpdesk_context
      parentRoles:
        - helpdesk
      condition:
        match:
          expr: request.principal.attr.assignments.exists(
                  a,
                  a.role == "helpdesk" && (
                    hierarchy(a.context).ancestorOf(hierarchy(request.resource.attr.position)) || a.context == request.resource.attr.position

                  )
                )

    - name: ouadmin_context
      parentRoles:
        - ouadmin
      condition:
        match:
          expr: request.principal.attr.assignments.exists(
                  a,
                  a.role == "ouadmin" && (
                    hierarchy(a.context).descendentOf(hierarchy(request.resource.attr.position)) || a.context == request.resource.attr.position
                  )
                )
