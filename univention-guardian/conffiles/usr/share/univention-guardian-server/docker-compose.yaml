services:
  cerbos:
    container_name: cerbos
    image: artifacts.software-univention.de/nubus/images/cerbos:0.54.0@sha256:211c261f6031675522a35c6055b13fd719c4aff13747307e4bcb6907326537ef
    # Cerbos is built FROM scratch (static binary, no /etc/passwd), so UID must be numeric.
    # guardian-server system user is created with this fixed UID by the Debian package preinst.
    user: "64110:64110"
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3592:3592"
      - "127.0.0.1:3593:3593"
    volumes:
      - /usr/share/univention-guardian-server/policies:/policies:ro
      - /usr/share/univention-guardian-server/config:/config:ro
    command: ["server", "--log-level=@%@guardian/cerbos/log-level@%@", "--config=/config/cerbos.yaml"]
    restart: unless-stopped
    networks:
      - guardian-internal

networks:
  guardian-internal:
    driver: bridge
