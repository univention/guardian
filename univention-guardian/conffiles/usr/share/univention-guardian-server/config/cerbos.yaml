# https://docs.cerbos.dev/cerbos/latest/configuration/index.html

server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"
@!@
if configRegistry.is_true('guardian/cerbos/audit-logging/enabled', False):
    print('  logRequestPayloads: true')
@!@
  playgroundEnabled: false
  apiExplorerEnabled: false
  requestLimits:
    maxActionsPerResource: 500
    maxResourcesPerRequest: 500

storage:
  driver: "disk"
  disk:
    directory: "/policies"
    watchForChanges: false

schema:
  enforcement: reject

@!@
if configRegistry.is_true('guardian/cerbos/audit-logging/enabled', False):
    print('audit:')
    print('  enabled: true')
    print('  accessLogsEnabled: true')
    print('  decisionLogsEnabled: true')
    print('  backend: file')
    print('  file:')
    print('    path: stdout')
    print('')
@!@
telemetry:
  disabled: true
