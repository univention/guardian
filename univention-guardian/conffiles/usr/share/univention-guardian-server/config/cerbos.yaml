# https://docs.cerbos.dev/cerbos/latest/configuration/index.html

server:
  grpcListenAddr: ":3593"
  playgroundEnabled: false
  apiExplorerEnabled: false
  requestLimits:
    maxActionsPerResource: 500
    maxResourcesPerRequest: 500

storage:
  driver: "disk"
  disk:
    directory: "/policies"
    watchForChanges: true

schema:
  enforcement: reject

telemetry:
  disabled: true
