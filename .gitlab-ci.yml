include:
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/ai-review@2.13.1
    inputs:
      clear_previous_comments: true
    rules:
      - if: $RUN_RENOVATE != "yes"
  - project: univention/infrastructure/docker-services
    file:
      - renovatebot/renovate.gitlab-ci.yml
    rules:
      - if: $RUN_RENOVATE == "yes"
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.67.3"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/lint-commit-messages.yaml"
      # Helm chart: derive the release version and publish to the OCI registry.
      - "jobs/semantic-release-env.yaml"
      - "jobs/package-and-publish-helm-charts-external.yaml"
  # Debian package: per-branch test builds, and release to the UCS errata repo.
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/debian-aptly@2.5.2"
    inputs:
      pkg-dir: univention-guardian
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/debian-errata-build@2.5.2"
    inputs:
      debian-package: univention-guardian
      pkg-dir: univention-guardian

variables:
  UCS_VERSION: "5.2-6"    # bump when starting a new UCS release branch
  # The Cerbos pin lives in three more places;
  # keep these two variables in sync with all of them.
  # The custom managers in renovate.json5 bump all four in one MR.
  #   univention-guardian/conffiles/.../docker-compose.yaml  image:
  #   helm/guardian/values.yaml                              cerbos.image.tag
  #   helm/guardian/Chart.yaml                               appVersion
  CERBOS_VERSION: "0.54.0"
  CERBOS_IMAGE_DIGEST: "sha256:211c261f6031675522a35c6055b13fd719c4aff13747307e4bcb6907326537ef"
  RUN_RENOVATE:
    value: "no"
    options:
      - "yes"
      - "no"
    description: "Set to yes if you want to run renovate"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
    - if: $CI_COMMIT_TAG
    - if: $RUN_RENOVATE == "yes"

# Unit tests of the Helm chart in helm/guardian.
test-chart-unit:
  stage: test
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.18"
  needs: []
  script:
    - helm dep build helm/guardian
    - pytest tests/chart

# Copy the pinned upstream Cerbos image into the artifact registry, which is the
# registry both the shipped docker-compose.yaml and the Helm chart pull from.
# Every file holding the pin has to be listed under rules:changes below, or a
# bump lands without the escape hatch to pre-populate the registry.
mirror-cerbos-image:
  stage: build
  image:
    name: docker-registry.knut.univention.de/skopeo/stable
    entrypoint: [""]
  variables:
    CERBOS_SRC_IMAGE: "ghcr.io/cerbos/cerbos@${CERBOS_IMAGE_DIGEST}"
    REGISTRY_HOST: "artifacts.software-univention.de"
    DEST_IMAGE: "artifacts.software-univention.de/nubus/images/cerbos"
    # "$$" escapes to a literal "$" for the Harbor robot-account name.
    ROBOT_ACCOUNT: "robot$$nubus-push-from-gitlab"
  rules:
    # Release mirrors automatically. Branch/MR that changes the pin is manual,
    # so a version bump can pre-populate the registry
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - changes:
        - univention-guardian/conffiles/usr/share/univention-guardian-server/docker-compose.yaml
        - helm/guardian/values.yaml
        - helm/guardian/Chart.yaml
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - echo "${EXTERNAL_REGISTRY_ROBOT_TOKEN}" | /bin/skopeo login
        --username "${ROBOT_ACCOUNT}" --password-stdin "${REGISTRY_HOST}"
    - /bin/skopeo copy --all --preserve-digests
        "docker://${CERBOS_SRC_IMAGE}"
        "docker://${DEST_IMAGE}:${CERBOS_VERSION}"

# Compile and test the shipped Guardian policies with the pinned Cerbos binary.
# This is the policy-correctness gate: it compiles every policy and runs the
# native tests in policies/tests/. (Only executes if there are changes to the
# policies dir.) The binary comes from the pre-commit image, which copies it out
# of the same upstream image CERBOS_IMAGE_DIGEST pins.
compile-policies:
  # Inherited for its image only, the pre-commit one carrying the cerbos
  # binary; stage, cache, rules and script are all replaced below.
  extends: ".lint-pre-commit"
  stage: test
  cache: []
  variables:
    CERBOS_NO_TELEMETRY: "1"
  rules:
    - changes:
        - univention-guardian/policies/**/*
  script:
    - cerbos compile --no-color univention-guardian/policies
